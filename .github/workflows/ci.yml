name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash clang-18 lld-18 wget cmake ninja-build \
            python3 python3-pyelftools xz-utils curl unzip file \
            librsvg2-bin

      - name: Download PS5 Payload SDK
        run: |
          mkdir -p "${{ runner.tool_cache }}"
          wget -q \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O /tmp/ps5-payload-sdk.zip
          unzip -q -o /tmp/ps5-payload-sdk.zip -d "${{ runner.tool_cache }}"
          rm -f /tmp/ps5-payload-sdk.zip

      - name: Build OnionHEN
        run: ./scripts/build.sh --${{ matrix.build_type }} --stub-missing
        env:
          PS5_PAYLOAD_SDK: ${{ runner.tool_cache }}/ps5-payload-sdk
          BUILD_DIR: ${{ github.workspace }}/build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onionhen-${{ matrix.build_type }}
          path: build/bin/
          if-no-files-found: error
